<!--
  BACKGROUND IMAGE
  ---------------------------------------
  Website.png is embedded directly below as a base64 data URI on .grid
  (not .stage) — it's inline so this single file works anywhere, no
  second file to keep alongside it. It's on .grid rather than .stage
  because the panel is blank space; this also means a future mobile
  layout just needs new left/top/width/height % on .grid, never a
  re-cropped image.

  If you'd rather keep the html lean and reference an external file
  instead (e.g. once this is hosted on GitHub), replace the long
  data:image/png;base64,... string in the .grid rule with a normal path
  or URL, e.g.:
       background-image:url('Website.png');
  and keep Website.png next to this file (or point at its raw GitHub URL).

  OTHER NOTES
  ---------------------------------------
  - Icons: pulled from the `icons` array in the script at the bottom, one
    per cell, in reading order (left-to-right, top-to-bottom).
  - Titles / descriptions: `projects` array, same order — shown in the
    side panel on hover.
  - Layout: grid + panel positions are absolute %, measured directly from
    your reference sketch's pixel coordinates (1920x1080 canvas). If you
    change the composition, these will need re-measuring, not guessing.
  - Project pages: NOT declared anywhere in this file. Clicking cell N
    (1-indexed) probes for Project_N_Page_1.jpg, _2.jpg, _3.jpg... and
    stops at the first missing one — whatever's found becomes the page
    list. Just upload jpgs with that naming pattern next to this file (or
    in the same GitHub repo folder) and it works, no code changes needed.
    See the "AUTO-DISCOVERY OF PAGE IMAGES" comment in the script for
    details, including why this can't be demonstrated in this chat's
    inline preview.
-->

<style>
  :root{
    --drape-duration: .55s;
    --icon-duration: .25s;
    --border: #111;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:#fff; /* page background outside the grid/panel — plain white to match your art's white space */
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    width:100vw;
    overflow:hidden;
  }

  /* locks the whole composition to 16:9 and letterboxes so nothing scrolls */
  .stage{
    position:relative;
    width:min(100vw, calc(100vh * 16 / 9));
    height:min(100vh, calc(100vw * 9 / 16));
  }

  /* ---------- GRID: 3 columns x 3 rows = 9 cells ---------- */
  .grid{
    /* position + size measured from the reference sketch (211,47)-(1185,1023) out of 1920x1080 */
    position:absolute;
    left:10.99%;
    top:4.35%;
    width:50.73%;
    height:90.37%;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:0;

  .cell{
    position:relative;
    background:transparent; /* lets the gray/bg-jpg show through until hovered */
    overflow:hidden;
    cursor:pointer;
  }

  /* the white "drape" that rises up from the bottom on hover */
  .drape{
    position:absolute;
    inset:0;
    background:#fff;
    transform:scaleY(0);
    transform-origin:bottom;
    transition:transform var(--drape-duration) cubic-bezier(.65,0,.35,1);
    pointer-events:none;
  }
  .cell:hover .drape{ transform:scaleY(1); }

  /* the icon that fades in once the drape has finished covering the cell */
  .icon{
    /* inset measured from your reference picture: ~7.8% sides, ~20% top/bottom of each cell */
    position:absolute;
    top:20%; bottom:20%; left:7.8%; right:7.8%;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transition:opacity var(--icon-duration) ease;
    transition-delay:0s;
    pointer-events:none;
  }
  .cell:hover .icon{
    opacity:1;
    transition-delay:var(--drape-duration);
  }
  .icon svg{
    width:100%;
    height:100%;
  }

  /* ---------- SIDE PANEL: text now lives here instead of on top ---------- */
  .panel{
    /* position + size measured from the reference sketch (1324,47)-(1648,1023) out of 1920x1080 */
    position:absolute;
    left:68.96%;
    top:4.35%;
    width:16.88%;
    height:90.37%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6%;
    background:transparent; /* your sketch already draws this box — no CSS border needed */
  }
  .panel h1{
    margin:0 0 12px;
    font-size:clamp(16px,1.6vw,22px);
    font-weight:600;
    color:#111;
  }
  .panel p{
    margin:0;
    color:#555;
    font-size:clamp(12px,1vw,14px);
    line-height:1.5;
  }

  /* ---------- MAIN MENU / PROJECT VIEW SWITCHING ---------- */
  .screen{
    position:absolute;
    inset:0;
  }
  #projectView{ display:none; }

  /* ---------- PROJECT VIEW: pager ---------- */
  .pager{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:#000;
  }
  .page{
    position:absolute;
    inset:0;
    transition:transform .55s cubic-bezier(.65,0,.35,1);
  }
  .page img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }

  .back-btn{
    position:absolute;
    top:18px;
    left:18px;
    z-index:2;
    width:34px;
    height:34px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.85);
    color:#111;
    font-size:16px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
    transition:transform .15s ease, background .15s ease;
  }
  .back-btn:hover{ transform:scale(1.08); background:#fff; }

  .page-indicator{
    position:absolute;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    z-index:2;
    color:rgba(255,255,255,.85);
    font-size:12px;
    letter-spacing:.5px;
    background:rgba(0,0,0,.35);
    padding:4px 10px;
    border-radius:999px;
  }
</style>

  // ---------- AUTO-DISCOVERY OF PAGE IMAGES ----------
  // No page counts are declared anywhere. For a given project number, this
  // tries to load Project_{n}_Page_1.jpg, _2.jpg, _3.jpg... and simply
  // stops at the first one that doesn't exist. Whatever loaded becomes the
  // page list. Add or remove jpgs in the repo and the site adjusts itself
  // automatically — nothing in this file needs to change.
  //
  // NOTE ON TESTING: this only works when the jpgs are actually reachable
  // next to this html file — either opened locally from the same folder,
  // or once it's live on GitHub Pages. The inline preview in this chat
  // can't demonstrate it (it only has this one file, no real neighbours
  // to fetch), so don't be alarmed if project cells look unresponsive
  // here — download everything into one folder to actually test this.
  const MAX_PAGES_TO_CHECK = 25;
  const pageCache = {};

  function probeProjectPages(projectNum) {
    if (pageCache[projectNum]) return pageCache[projectNum];
    const checks = [];
    for (let p = 1; p <= MAX_PAGES_TO_CHECK; p++) {
      const src = `Project_${projectNum}_Page_${p}.jpg`;
      checks.push(new Promise((resolve) => {
        const img = new Image();
        img.onload  = () => resolve({ p, src, ok: true });
        img.onerror = () => resolve({ p, src, ok: false });
        img.src = src;
      }));
    }
    const promise = Promise.all(checks).then((results) => {
      const pages = [];
      for (let p = 1; p <= MAX_PAGES_TO_CHECK; p++) {
        const r = results.find((r) => r.p === p);
        if (r && r.ok) pages.push(r.src); else break; // stop at first gap
      }
      return pages;
    });
    pageCache[projectNum] = promise;
    return promise;
  }

  function comingSoonPage(){
    return `<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;">
      <rect width="1920" height="1080" fill="#222"/>
      <text x="960" y="540" font-size="90" font-family="Helvetica, Arial, sans-serif" fill="#fff" text-anchor="middle">Coming soon</text>
    </svg>`;
  }

  // placeholder titles / descriptions — replace with your real project text
  const projects = Array.from({ length: 9 }, (_, i) => ({
    title: `Project ${String(i + 1).padStart(2, '0')} — Working Title`,
    desc:  `Placeholder description for project ${i + 1}. Replace this with a short summary of the concept, materials, and method.`,
    icon:  icons[i]
  }));

  const grid = document.getElementById('grid');
  const panelTitle = document.getElementById('panelTitle');
  const panelDesc  = document.getElementById('panelDesc');
  const stage = document.getElementById('stage');
  const mainMenu = document.getElementById('mainMenu');
  const projectView = document.getElementById('projectView');
  const pager = document.getElementById('pager');
  const pagerTrack = document.getElementById('pagerTrack');
  const pageIndicator = document.getElementById('pageIndicator');
  const backBtn = document.getElementById('backBtn');

  projects.forEach((p, idx) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = `
      <div class="drape"></div>
      <div class="icon">${p.icon}</div>
    `;
    cell.addEventListener('mouseenter', () => {
      panelTitle.textContent = p.title;
      panelDesc.textContent  = p.desc;
    });
    cell.addEventListener('mouseleave', () => {
      panelTitle.textContent = DEFAULT_TITLE;
      panelDesc.textContent  = DEFAULT_DESC;
    });
    // every cell is clickable — whether it actually has pages is only
    // known once we've probed for its Project_{n}_Page_{p}.jpg files
    cell.style.cursor = 'pointer';
    cell.addEventListener('click', () => openProject(idx));
    grid.appendChild(cell);
  });

  // ---------- PROJECT VIEW / PAGER ----------
  let currentProject = null;
  let currentPage = 0;
  let pageEls = [];
  let isProjectOpen = false;
  let navLocked = false;

  async function openProject(idx){
    currentProject = idx;
    currentPage = 0;
    const projectNum = idx + 1;
    const discovered = await probeProjectPages(projectNum);
    const pages = discovered.length
      ? discovered.map(src => `<img src="${src}" alt="${projects[idx].title} page">`)
      : [comingSoonPage()];
    pagerTrack.innerHTML = pages
      .map(html => `<div class="page">${html}</div>`)
      .join('');
    pageEls = Array.from(pagerTrack.children);
    layoutPages(false);
    updateIndicator();
    mainMenu.style.display = 'none';
    projectView.style.display = 'block';
    isProjectOpen = true;
  }

  function closeProject(){
    projectView.style.display = 'none';
    mainMenu.style.display = 'block';
    isProjectOpen = false;
  }

  function layoutPages(animate){
    pageEls.forEach((el, i) => {
      el.style.transition = animate === false ? 'none' : '';
      const diff = i - currentPage;
      el.style.transform = diff === 0 ? 'translateY(0)'
                          : diff < 0 ? 'translateY(-100%)'
                          : 'translateY(100%)';
    });
    if (animate === false) {
      // force layout so the "no transition" jump is applied before re-enabling it
      void pagerTrack.offsetHeight;
      pageEls.forEach(el => { el.style.transition = ''; });
    }
  }

  function updateIndicator(){
    pageIndicator.textContent = `${currentPage + 1} / ${pageEls.length}`;
  }

  function goNext(){
    if (currentPage < pageEls.length - 1) {
      currentPage++;
      layoutPages();
      updateIndicator();
    } else {
      closeProject(); // past the last page -> back to main menu
    }
  }

  function goPrev(){
    if (currentPage > 0) {
      currentPage--;
      layoutPages();
      updateIndicator();
    } else {
      closeProject(); // before the first page -> back to main menu
    }
  }

  backBtn.addEventListener('click', closeProject);

  pager.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (navLocked) return;
    navLocked = true;
    if (e.deltaY > 0) goNext(); else if (e.deltaY < 0) goPrev();
    setTimeout(() => { navLocked = false; }, 650);
  }, { passive: false });

  document.addEventListener('keydown', (e) => {
    if (!isProjectOpen) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' ') {
      e.preventDefault();
      if (!navLocked) { navLocked = true; goNext(); setTimeout(() => { navLocked = false; }, 650); }
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
      e.preventDefault();
      if (!navLocked) { navLocked = true; goPrev(); setTimeout(() => { navLocked = false; }, 650); }
    } else if (e.key === 'Escape') {
      closeProject();
    }
  });
</script>
</body>
